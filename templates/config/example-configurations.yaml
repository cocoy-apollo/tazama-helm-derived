{{/*
  Sample Configuration Documents

  This file contains sample NetworkMap, RuleConfig, and TypologyConfig
  documents that demonstrate the configuration structure for Tazama.

  These are used when configSeed.examples.enabled is true.
*/}}

{{- if .Values.configSeed.examples.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tazama-example-configurations
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: tazama
    app.kubernetes.io/component: example-config
data:
  README.md: |
    # Tazama Example Configurations
    
    This ConfigMap contains example configurations for the Tazama platform.
    
    ## NetworkMap Structure
    
    The NetworkMap defines how messages flow through the system:
    
    ```
    Message (pain.001.001.11)
      └── Typology (typology-01)
          ├── Rule (rule-901)
          └── Rule (rule-902)
    ```
    
    ## RuleConfig Structure
    
    Each rule has:
    - `id`: Rule identifier (e.g., "rule-901")
    - `cfg`: Configuration version (e.g., "rule-901-v1")
    - `tenantId`: Tenant identifier
    - `config`: Rule-specific configuration including:
      - `parameters`: Key-value parameters
      - `bands`: Threshold bands with outcomes
      - `exitConditions`: Error handling conditions
    
    ## TypologyConfig Structure
    
    Each typology has:
    - `id`: Typology identifier (e.g., "typology-01")
    - `cfg`: Configuration version
    - `tenantId`: Tenant identifier
    - `config`: Scoring configuration including:
      - `expression`: Scoring formula (uses {rule-xxx} placeholders)
      - `threshold`: Alert threshold
      - `bands`: Risk bands

  networkMap-example.json: |
    {
      "active": true,
      "cfg": "default-v1",
      "tenantId": "default",
      "messages": [
        {
          "id": "pain.001.001.11",
          "cfg": "pain001-default-v1",
          "txTp": "pacs.008",
          "typologies": [
            {
              "id": "typology-01",
              "cfg": "typology-01-v1",
              "rules": [
                { "id": "rule-901", "cfg": "rule-901-v1" },
                { "id": "rule-902", "cfg": "rule-902-v1" }
              ]
            }
          ]
        },
        {
          "id": "pain.001.001.12",
          "cfg": "pain001-default-v1",
          "txTp": "pacs.008",
          "typologies": [
            {
              "id": "typology-01",
              "cfg": "typology-01-v1",
              "rules": [
                { "id": "rule-901", "cfg": "rule-901-v1" },
                { "id": "rule-902", "cfg": "rule-902-v1" }
              ]
            }
          ]
        }
      ]
    }

  ruleConfig-example.json: |
    {
      "id": "rule-901",
      "cfg": "rule-901-v1",
      "tenantId": "default",
      "desc": "Count of transactions debtor made - aggregates transaction history",
      "config": {
        "parameters": {
          "maxQueryRange": 86400,
          "minTransactions": 3,
          "lookbackDays": 30
        },
        "bands": [
          {
            "lowerLimit": 0,
            "upperLimit": 5,
            "subRuleRef": ".x00",
            "reason": "Normal transaction volume - no action required"
          },
          {
            "lowerLimit": 5,
            "upperLimit": 10,
            "subRuleRef": ".x01",
            "reason": "Elevated transaction volume - monitoring recommended"
          },
          {
            "lowerLimit": 10,
            "upperLimit": 20,
            "subRuleRef": ".x02",
            "reason": "High transaction volume - review recommended"
          },
          {
            "lowerLimit": 20,
            "subRuleRef": ".x03",
            "reason": "Very high transaction volume - immediate review required"
          }
        ],
        "exitConditions": [
          {
            "subRuleRef": ".err",
            "reason": "Error processing transaction - system error"
          }
        ],
        "timeframes": [
          {
            "threshold": 3600
          }
        ]
      }
    }

  typologyConfig-example.json: |
    {
      "id": "typology-01",
      "cfg": "typology-01-v1",
      "tenantId": "default",
      "desc": "Transaction volume monitoring typology - combines rule outcomes",
      "config": {
        "expression": "({rule-901} * 0.6) + ({rule-902} * 0.4)",
        "threshold": 50,
        "bands": [
          {
            "lowerLimit": 0,
            "upperLimit": 30,
            "subRuleRef": ".x00",
            "reason": "Low risk - normal transaction pattern"
          },
          {
            "lowerLimit": 30,
            "upperLimit": 50,
            "subRuleRef": ".x01",
            "reason": "Medium risk - elevated pattern detected"
          },
          {
            "lowerLimit": 50,
            "upperLimit": 75,
            "subRuleRef": ".x02",
            "reason": "High risk - suspicious pattern detected"
          },
          {
            "lowerLimit": 75,
            "subRuleRef": ".x03",
            "reason": "Critical risk - immediate alert required"
          }
        ]
      }
    }
{{- end }}
