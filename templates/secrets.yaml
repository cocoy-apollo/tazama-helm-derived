{{- /*
  secrets.yaml - Database credentials secret
  Conditional rendering based on infrastructure mode
  
  C1, C3: Only rendered when internal postgres is enabled (secrets managed by chart)
  When external: user provides their own secret via infrastructure.postgres.external.secretRef
  
  For internal deployments, default credentials are used (postgres/postgres).
  For production, users should override these or use external mode with proper secrets.
*/ -}}
{{- if include "tazama.infrastructure.internal.enabled" (dict "component" "postgres" "context" $) }}
{{- $username := "postgres" -}}
{{- $password := "postgres" -}}
{{- if .Values.infrastructure.postgres.auth -}}
  {{- $username = .Values.infrastructure.postgres.auth.username | default "postgres" -}}
  {{- $password = .Values.infrastructure.postgres.auth.password | default "postgres" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tazama.database.secretName" (dict "component" "postgres" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tazama-shared-secrets
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tazama
type: Opaque
stringData:
  # Configuration database credentials
  CONFIGURATION_DATABASE_USER: {{ $username | quote }}
  CONFIGURATION_DATABASE_PASSWORD: {{ $password | quote }}
  
  # Event history database credentials  
  EVENT_HISTORY_DATABASE_USER: {{ $username | quote }}
  EVENT_HISTORY_DATABASE_PASSWORD: {{ $password | quote }}
  
  # Evaluation database credentials
  EVALUATION_DATABASE_USER: {{ $username | quote }}
  EVALUATION_DATABASE_PASSWORD: {{ $password | quote }}
  
  # Raw history database credentials
  RAW_HISTORY_DATABASE_USER: {{ $username | quote }}
  RAW_HISTORY_DATABASE_PASSWORD: {{ $password | quote }}
{{- end }}
