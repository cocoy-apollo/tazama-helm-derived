{{/*
  Tazama Rule Deployments
  
  Dynamically generates deployments for all enabled rules defined in values.yaml.
  Rules are configured under .Values.rules with the following structure:
  
  rules:
    rule-XXX:
      name: "Human readable name"
      description: "Description"
      enabled: true/false
      riskWeight: 0.X
      
  Each rule deployment connects to:
  - PostgreSQL (configuration, raw_history, event_history databases)
  - Valkey (Redis-compatible cache)
  - NATS (message bus)
*/}}

{{- range $ruleId, $ruleConfig := .Values.rules }}
{{- if $ruleConfig.enabled }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ruleId }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $ruleId }}
    app.kubernetes.io/name: {{ $ruleId }}
    app.kubernetes.io/part-of: tazama
    app.kubernetes.io/component: rule
spec:
  replicas: {{ $.Values.rulesDefaults.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $ruleId }}
  template:
    metadata:
      labels:
        app: {{ $ruleId }}
        app.kubernetes.io/name: {{ $ruleId }}
        app.kubernetes.io/part-of: tazama
        app.kubernetes.io/component: rule
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      {{- if $.Values.rulesDefaults.waitForSchema | default true }}
      initContainers:
        {{- /* Wait for database schema to be fully initialized */}}
        - name: wait-db
          image: "postgres:18-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d raw_history -c "SELECT 'pain013'::regclass;" >/dev/null 2>&1; do
                echo "Waiting for the full Tazama database schema to finish initializing..."
                sleep 2
              done
              echo "Database schema ready"
              
        {{- /* Wait for Valkey to be available */}}
        - name: wait-valkey
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z valkey 6379; do
                echo "Waiting for Valkey..."
                sleep 2
              done
              echo "Valkey ready"
              
        {{- /* Wait for NATS to be available */}}
        - name: wait-nats
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z nats 4222; do
                echo "Waiting for NATS..."
                sleep 2
              done
              echo "NATS ready"
      {{- end }}
      
      containers:
        - name: {{ $ruleId }}
          image: "{{ $.Values.global.imageRegistry | default "ghcr.io/frmscoe" }}/{{ $ruleId }}:{{ $.Values.global.tazamaVersion | default "latest" }}"
          imagePullPolicy: {{ $.Values.rulesDefaults.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
              
          {{- /* Liveness and readiness probes */}}
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          env:
            {{- /* Startup configuration */}}
            - name: STARTUP_TYPE
              value: "nats"
              
            - name: APM_SERVICE_NAME
              value: {{ $ruleId | quote }}
              
            {{- /* Database configuration */}}
            - name: CONFIGURATION_DATABASE
              value: "configuration"
            - name: RAW_HISTORY_DATABASE
              value: "raw_history"
            - name: EVENT_HISTORY_DATABASE
              value: "event_history"
              
            {{- /* PostgreSQL connection settings */}}
            - name: CONFIGURATION_DATABASE_HOST
              value: "postgres"
            - name: CONFIGURATION_DATABASE_PORT
              value: "5432"
            - name: RAW_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: RAW_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVENT_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: EVENT_HISTORY_DATABASE_PORT
              value: "5432"
            
            {{- /* Valkey/Redis configuration */}}
            - name: REDIS_SERVERS
              value: '[{"host":"valkey","port":6379}]'
            - name: REDIS_CLUSTER
              value: "false"
            
            {{- /* NATS configuration */}}
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_CLUSTER_ID
              value: "tazama-cluster"
            
            {{- /* Rule-specific configuration */}}
            - name: FUNCTION_NAME
              value: {{ printf "%s-rel-1-0-0" $ruleId | quote }}
            - name: RULE_NAME
              value: {{ trimPrefix "rule-" $ruleId | quote }}
            - name: RULE_VERSION
              value: {{ $.Values.rulesDefaults.version | default "1.0.0" | quote }}
              
            {{- /* Risk weight from rule config */}}
            - name: RISK_WEIGHT
              value: {{ $ruleConfig.riskWeight | default 0.5 | quote }}
              
            {{- /* Rule metadata for observability */}}
            - name: RULE_DISPLAY_NAME
              value: {{ $ruleConfig.name | default $ruleId | quote }}
            - name: RULE_DESCRIPTION
              value: {{ $ruleConfig.description | default "" | quote }}
              
            {{- /* Additional environment variables from config */}}
            {{- with $ruleConfig.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
                
          resources:
            requests:
              cpu: {{ $.Values.rulesDefaults.resources.requests.cpu | default "100m" }}
              memory: {{ $.Values.rulesDefaults.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ $.Values.rulesDefaults.resources.limits.cpu | default "500m" }}
              memory: {{ $.Values.rulesDefaults.resources.limits.memory | default "512Mi" }}
              
      {{- /* Security context */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        
      {{- /* Node affinity/ tolerations */}}
      {{- with $.Values.rulesDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.rulesDefaults.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.rulesDefaults.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
{{- end }}

---
{{- /* Service definition for all rules - allows direct access to individual rules */}}
apiVersion: v1
kind: Service
metadata:
  name: tazama-rules
  namespace: {{ .Release.Namespace }}
  labels:
    app: tazama-rules
    app.kubernetes.io/part-of: tazama
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: rule
