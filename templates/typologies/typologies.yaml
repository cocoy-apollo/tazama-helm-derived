{{/*
  Tazama Typology Processor Deployments
  
  Dynamically generates deployments for all enabled typologies defined in values.yaml.
  Typologies are groupings of rules that process results and produce alerts.
  
  typologies:
    <typology-id>:
      name: "Human readable name"
      description: "Description"
      enabled: true/false
      rules:
        - rule-001
        - rule-002
      alertThreshold: 0.X
      
  Each typology deployment connects to:
  - PostgreSQL (configuration, raw_history, event_history, evaluation databases)
  - Valkey (Redis-compatible cache)
  - NATS (message bus)
  
  Typology processors:
  - Subscribe to rule results from NATS
  - Aggregate rule scores according to typology logic
  - Produce alerts when thresholds are exceeded
  - Route alerts to downstream systems
*/}}

{{- range $typologyId, $typologyConfig := .Values.typologies }}
{{- if $typologyConfig.enabled }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $typologyId }}-typology
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $typologyId }}-typology
    app.kubernetes.io/name: {{ $typologyId }}-typology
    app.kubernetes.io/part-of: tazama
    app.kubernetes.io/component: typology
spec:
  replicas: {{ $.Values.rulesDefaults.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $typologyId }}-typology
  template:
    metadata:
      labels:
        app: {{ $typologyId }}-typology
        app.kubernetes.io/name: {{ $typologyId }}-typology
        app.kubernetes.io/part-of: tazama
        app.kubernetes.io/component: typology
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      {{- if $.Values.rulesDefaults.waitForSchema | default true }}
      initContainers:
        {{- /* Wait for database schema to be fully initialized */}}
        - name: wait-db
          image: "postgres:18-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d evaluation -c "SELECT 1;" >/dev/null 2>&1; do
                echo "Waiting for database to be ready..."
                sleep 2
              done
              echo "Database ready"
              
        {{- /* Wait for Valkey to be available */}}
        - name: wait-valkey
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z valkey 6379; do
                echo "Waiting for Valkey..."
                sleep 2
              done
              echo "Valkey ready"
              
        {{- /* Wait for NATS to be available */}}
        - name: wait-nats
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z nats 4222; do
                echo "Waiting for NATS..."
                sleep 2
              done
              echo "NATS ready"
      {{- end }}
      
      containers:
        - name: {{ $typologyId }}-typology
          image: "{{ $.Values.global.imageRegistry | default "ghcr.io/frmscoe" }}/typology-processor:{{ $.Values.global.tazamaVersion | default "latest" }}"
          imagePullPolicy: {{ $.Values.rulesDefaults.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
              
          {{- /* Liveness and readiness probes */}}
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          env:
            {{- /* Startup configuration */}}
            - name: STARTUP_TYPE
              value: "nats"
              
            - name: APM_SERVICE_NAME
              value: {{ printf "%s-typology" $typologyId | quote }}
              
            {{- /* Database configuration */}}
            - name: CONFIGURATION_DATABASE
              value: "configuration"
            - name: RAW_HISTORY_DATABASE
              value: "raw_history"
            - name: EVENT_HISTORY_DATABASE
              value: "event_history"
            - name: EVALUATION_DATABASE
              value: "evaluation"
              
            {{- /* PostgreSQL connection settings */}}
            - name: CONFIGURATION_DATABASE_HOST
              value: "postgres"
            - name: CONFIGURATION_DATABASE_PORT
              value: "5432"
            - name: RAW_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: RAW_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVENT_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: EVENT_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVALUATION_DATABASE_HOST
              value: "postgres"
            - name: EVALUATION_DATABASE_PORT
              value: "5432"
            
            {{- /* Valkey/Redis configuration */}}
            - name: REDIS_SERVERS
              value: '[{"host":"valkey","port":6379}]'
            - name: REDIS_CLUSTER
              value: "false"
            
            {{- /* NATS configuration - subscribe to rule results */}}
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_CLUSTER_ID
              value: "tazama-cluster"
              
            {{- /* Typology configuration */}}
            - name: TYPOLOGY_NAME
              value: {{ $typologyId | quote }}
            - name: TYPOLOGY_ID
              value: {{ $typologyId | quote }}
            - name: TYPOLOGY_DISPLAY_NAME
              value: {{ $typologyConfig.name | default $typologyId | quote }}
            - name: TYPOLOGY_DESCRIPTION
              value: {{ $typologyConfig.description | default "" | quote }}
            - name: TYPOLOGY_RULES
              value: {{ $typologyConfig.rules | toJson | quote }}
            - name: ALERT_THRESHOLD
              value: {{ $typologyConfig.alertThreshold | default 0.7 | quote }}
              
            {{- /* Processing configuration */}}
            - name: FUNCTION_NAME
              value: {{ printf "%s-typology-rel-1-0-0" $typologyId | quote }}
              
            {{- /* Additional environment variables from config */}}
            {{- with $typologyConfig.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
                
          resources:
            requests:
              cpu: {{ $.Values.rulesDefaults.resources.requests.cpu | default "100m" }}
              memory: {{ $.Values.rulesDefaults.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ $.Values.rulesDefaults.resources.limits.cpu | default "500m" }}
              memory: {{ $.Values.rulesDefaults.resources.limits.memory | default "512Mi" }}
              
      {{- /* Security context */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        
      {{- /* Node affinity/ tolerations */}}
      {{- with $.Values.rulesDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.rulesDefaults.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.rulesDefaults.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
{{- end }}

---
{{- /* Service definition for all typologies */}}
apiVersion: v1
kind: Service
metadata:
  name: tazama-typologies
  namespace: {{ .Release.Namespace }}
  labels:
    app: tazama-typologies
    app.kubernetes.io/part-of: tazama
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: typology

---
{{- /* Main typology processor service - primary entry point for AML processing */}}
{{- if .Values.typologies.main }}
apiVersion: v1
kind: Service
metadata:
  name: tazama-aml-processor
  namespace: {{ .Release.Namespace }}
  labels:
    app: tazama-aml-processor
    app.kubernetes.io/part-of: tazama
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.typologies.main }}-typology
{{- end }}

---
{{- /* HorizontalPodAutoscaler for typologies - allows dynamic scaling based on load */}}
{{- if .Values.typologies.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tazama-typologies-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: tazama
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.typologies.main | default "typology-processor" }}-typology
  minReplicas: {{ .Values.typologies.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.typologies.autoscaling.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.typologies.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
