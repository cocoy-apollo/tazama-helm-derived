{{/*
========================================================================
VALIDATION HOOK
========================================================================
This template runs at pre-install and pre-upgrade hooks to validate
the infrastructure configuration before any resources are deployed.

It uses Helm hooks to fail early with clear error messages rather than
deploying invalid configurations that fail at runtime.
========================================================================
*/}}

{{- if .Values.validation.enabled | default true -}}

apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-validation-hook"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "-10"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  restartPolicy: Never
  serviceAccountName: {{ .Release.Name }}-validation-sa
  containers:
    - name: validation
      image: "busybox:latest"
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Running infrastructure validation..."
          echo "Release: {{ .Release.Name }}"
          echo "Namespace: {{ .Release.Namespace }}"
          
          {{- /* PostgreSQL validation */}}
          POSTGRES_MODE="{{ include "tazama.infrastructure.mode" (dict "component" "postgres" "context" .) }}"
          echo "PostgreSQL mode: $POSTGRES_MODE"
          
          {{- if and .Values.infrastructure.postgres.external.enabled .Values.infrastructure.postgres.enabled }}
          echo "ERROR (C2): PostgreSQL enabled and external.enabled are both true - mutually exclusive"
          exit 1
          {{- end }}
          
          {{- if .Values.infrastructure.postgres.external.enabled }}
          {{- if not .Values.infrastructure.postgres.external.host }}
          echo "ERROR (C10): PostgreSQL external.host is required when external.enabled=true"
          exit 1
          {{- end }}
          {{- if not .Values.infrastructure.postgres.external.secretRef.name }}
          echo "ERROR (C5/C10): PostgreSQL external.secretRef.name is required when external.enabled=true"
          exit 1
          {{- end }}
          {{- end }}
          
          {{- /* Valkey validation */}}
          VALKEY_MODE="{{ include "tazama.infrastructure.mode" (dict "component" "valkey" "context" .) }}"
          echo "Valkey mode: $VALKEY_MODE"
          
          {{- if and .Values.infrastructure.valkey.external.enabled .Values.infrastructure.valkey.enabled }}
          echo "ERROR (C2): Valkey enabled and external.enabled are both true - mutually exclusive"
          exit 1
          {{- end }}
          
          {{- if .Values.infrastructure.valkey.external.enabled }}
          {{- if not .Values.infrastructure.valkey.external.host }}
          echo "ERROR (C10): Valkey external.host is required when external.enabled=true"
          exit 1
          {{- end }}
          {{- end }}
          
          {{- /* NATS validation */}}
          NATS_MODE="{{ include "tazama.infrastructure.mode" (dict "component" "nats" "context" .) }}"
          echo "NATS mode: $NATS_MODE"
          
          {{- if and .Values.infrastructure.nats.external.enabled .Values.infrastructure.nats.enabled }}
          echo "ERROR (C2): NATS enabled and external.enabled are both true - mutually exclusive"
          exit 1
          {{- end }}
          
          {{- if .Values.infrastructure.nats.external.enabled }}
          {{- if not .Values.infrastructure.nats.external.host }}
          echo "ERROR (C10): NATS external.host is required when external.enabled=true"
          exit 1
          {{- end }}
          {{- end }}
          
          # Check for disabled infrastructure with warnings
          {{- if eq (include "tazama.infrastructure.mode" (dict "component" "postgres" "context" .)) "disabled" }}
          echo "WARNING: PostgreSQL is DISABLED - services requiring database will fail"
          {{- end }}
          
          {{- if eq (include "tazama.infrastructure.mode" (dict "component" "valkey" "context" .)) "disabled" }}
          echo "WARNING: Valkey is DISABLED - caching features will not function"
          {{- end }}
          
          {{- if eq (include "tazama.infrastructure.mode" (dict "component" "nats" "context" .)) "disabled" }}
          echo "WARNING: NATS is DISABLED - event-driven features will not function"
          {{- end }}
          
          echo "Configuration validation passed!"
          exit 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}-validation-sa"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "-20"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ .Release.Name }}-validation-role"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "-20"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-validation-rolebinding"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "-15"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ .Release.Name }}-validation-role"
subjects:
- kind: ServiceAccount
  name: "{{ .Release.Name }}-validation-sa"
  namespace: "{{ .Release.Namespace }}"

{{- end -}}
