apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-behavior-typology
  namespace: default
  labels:
    app: account-behavior-typology
    app.kubernetes.io/name: account-behavior-typology
    app.kubernetes.io/part-of: tazama
    app.kubernetes.io/component: typology
    typology.tazama.io/name: "Account Behavior Analysis"
    typology.tazama.io/id: "account-behavior"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-behavior-typology
  template:
    metadata:
      labels:
        app: account-behavior-typology
        app.kubernetes.io/name: account-behavior-typology
        app.kubernetes.io/part-of: tazama
        app.kubernetes.io/component: typology
        typology.tazama.io/name: "Account Behavior Analysis"
        typology.tazama.io/id: "account-behavior"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-db
          image: "postgres:18-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d evaluation -c "SELECT 1;" >/dev/null 2>&1; do
                echo "Waiting for database to be ready..."
                sleep 2
              done
              echo "Database ready"
        - name: wait-valkey
          image: "docker.io/tazamaorg/busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z valkey 6379; do
                echo "Waiting for Valkey..."
                sleep 2
              done
              echo "Valkey ready"
        - name: wait-nats
          image: "docker.io/tazamaorg/busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z nats 4222; do
                echo "Waiting for NATS..."
                sleep 2
              done
              echo "NATS ready"
      
      containers:
        - name: account-behavior-typology
          image: "docker.io/tazamaorg/typology-processor:rc"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          env:
            - name: STARTUP_TYPE
              value: "nats"
              
            - name: APM_SERVICE_NAME
              value: "account-behavior-typology"
            - name: CONFIGURATION_DATABASE
              value: "configuration"
            - name: RAW_HISTORY_DATABASE
              value: "raw_history"
            - name: EVENT_HISTORY_DATABASE
              value: "event_history"
            - name: EVALUATION_DATABASE
              value: "evaluation"
            - name: CONFIGURATION_DATABASE_HOST
              value: "postgres"
            - name: CONFIGURATION_DATABASE_PORT
              value: "5432"
            - name: RAW_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: RAW_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVENT_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: EVENT_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVALUATION_DATABASE_HOST
              value: "postgres"
            - name: EVALUATION_DATABASE_PORT
              value: "5432"
            - name: REDIS_SERVERS
              value: '[{"host":"valkey","port":6379}]'
            - name: REDIS_CLUSTER
              value: "false"
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_CLUSTER_ID
              value: "tazama-cluster"
            - name: TYPOLOGY_NAME
              value: "account-behavior"
            - name: TYPOLOGY_ID
              value: "account-behavior"
            - name: TYPOLOGY_DISPLAY_NAME
              value: "Account Behavior Analysis"
            - name: TYPOLOGY_DESCRIPTION
              value: "Rules focused on account lifecycle and behavior patterns"
            - name: TYPOLOGY_RULES
              value: "[\"rule-001\",\"rule-003\",\"rule-004\",\"rule-010\",\"rule-011\",\"rule-028\"]"
            - name: ALERT_THRESHOLD
              value: "0.6"
            - name: FUNCTION_NAME
              value: "account-behavior-typology-rel-1-0-0"
            
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
                
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
