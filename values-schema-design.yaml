# ==============================================================================
# FLEXIBLE INFRASTRUCTURE VALUES SCHEMA DESIGN
# ==============================================================================
# This document defines the proposed values.yaml schema supporting three modes:
#   1. INTERNAL (auto-scaffolded infrastructure) — current default behavior
#   2. EXTERNAL (managed services) — connect to AWS RDS, ElastiCache, etc.
#   3. HYBRID — mix internal and external per-service
#
# CONSTRAINTS SATISFIED:
#   - C1: Infrastructure components MUST never deploy when external.enabled=true
#   - C2: Internal and external configs MUST never both be active (validation)
#   - C4: Credentials MUST never be stored in values.yaml (secretRef pattern)
#   - C5: Secrets MUST never default to working placeholder values
#   - C13: Feature flag defaults MUST preserve current behavior (backward compat)
#   - C10: Chart MUST fail if required dependencies are unavailable
# ==============================================================================

global:
  tazamaVersion: "rc"
  imageRegistry: "docker.io/tazamaorg"
  storageClass: "longhorn-single"  # Environment-specific, must be parameterizable

# ==============================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ==============================================================================
# Three mutually exclusive modes:
#   1. infrastructure.postgres.enabled=true  (internal, default)
#   2. infrastructure.postgres.external.enabled=true (external managed)
#   3. infrastructure.postgres.disabled=true (no database, fail if services need it)

infrastructure:
  postgres:
    # ---------------------------------------------------------------------------
    # MODE 1: INTERNAL INFRASTRUCTURE (current default behavior)
    # ---------------------------------------------------------------------------
    enabled: true  # DEFAULT — preserves backward compatibility [C13]
    
    image: "postgres:18-alpine"
    storageSize: "5Gi"
    
    # Internal credentials (auto-generated if not provided)
    # These are ONLY used when enabled=true
    database: "tazama"
    user: "postgres"
    # password: OMITTED — must be provided via:
    #   --set infrastructure.postgres.passwordSecret.name=my-secret
    #   --set infrastructure.postgres.passwordSecret.key=password
    # If omitted, chart generates a random password [C5: never placeholder]
    
    # Secret reference for internal DB password
    passwordSecret:
      name: ""   # If empty, chart creates: <release>-postgres-credentials
      key: "password"
    
    # Persistence settings for internal PostgreSQL
    persistence:
      enabled: true
      storageClass: ""  # Falls back to global.storageClass
      accessMode: ReadWriteOnce
      retentionPolicy: Retain  # [C7: never delete PVC on uninstall without intent]
    
    # Resource limits for internal PostgreSQL
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    # ---------------------------------------------------------------------------
    # MODE 2: EXTERNAL MANAGED SERVICE (AWS RDS, Azure PostgreSQL, etc.)
    # ---------------------------------------------------------------------------
    external:
      enabled: false  # When true, internal Deployment is NOT created [C1]
      
      # Connection endpoint
      host: ""       # REQUIRED if external.enabled=true — e.g., "mydb.xxxx.us-east-1.rds.amazonaws.com"
      port: 5432     # Default PostgreSQL port
      
      # Database details
      database: "tazama"
      
      # TLS Configuration [C14: never bypass TLS without explicit waiver]
      ssl:
        enabled: true   # RECOMMENDED: true
        require: true   # Fail if TLS cannot be negotiated
        skipVerify: false  # SECURITY WARNING: if true, bypasses cert verification
      
      # Credential injection — MUST use existing Kubernetes Secret [C4]
      # The secret must contain: DB_USER, DB_PASSWORD
      # Chart FAILS if secretRef is empty when external.enabled=true [C10]
      secretRef:
        name: ""     # REQUIRED — e.g., "rds-credentials"
        # Expected keys in the secret:
        #   user:     Database username
        #   password: Database password
        
      # Connection pooling (optional, for external services)
      connectionPool:
        maxConnections: 20
        idleTimeout: 300

    # ---------------------------------------------------------------------------
    # MODE 3: DISABLED (use when services don't need database)
    # ---------------------------------------------------------------------------
    disabled: false  # If true AND external.enabled=false, NO database deployed
    # Chart MUST fail at render time if services require DB but it's disabled [C10]

  # ==============================================================================
  # CACHING LAYER (Valkey/Redis)
  # ==============================================================================
  valkey:
    # Default: internal Valkey [C13: backward compat]
    enabled: true
    
    image: "valkey/valkey:7.2.5"
    
    # Internal resource configuration
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    
    # Persistence for internal Valkey (optional)
    persistence:
      enabled: false
      storageSize: "1Gi"

    external:
      enabled: false
      
      # Connection endpoint
      host: ""       # e.g., "mycache.xxxx.0001.use1.cache.amazonaws.com"
      port: 6379
      
      # TLS [C14]
      ssl:
        enabled: true
        skipVerify: false
      
      # Authentication
      secretRef:
        name: ""     # REQUIRED if external.enabled=true
        # Expected keys: password (if auth required)
      
      # Cluster mode for AWS ElastiCache Cluster
      cluster:
        enabled: false
        nodes: []    # List of cluster endpoints if cluster mode

    disabled: false

  # ==============================================================================
  # MESSAGE BROKER (NATS)
  # ==============================================================================
  nats:
    enabled: true   # Default: internal NATS [C13]
    
    image: "nats:2"
    
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

    external:
      enabled: false
      
      # Connection endpoint
      host: ""       # e.g., "nats.example.com"
      port: 4222
      
      # TLS [C14]
      ssl:
        enabled: true
        skipVerify: false
      
      # Authentication
      secretRef:
        name: ""     # REQUIRED if external.enabled=true
        # Expected keys: user, password (or token)
      
      # Cluster configuration
      cluster:
        enabled: false
        urls: []     # List of cluster URLs if cluster mode

    disabled: false

# ==============================================================================
# CORE SERVICES CONFIGURATION
# ==============================================================================
core:
  adminService:
    port: 3100
    replicas: 1
    
  tms:
    port: 3000
    replicas: 1

# ==============================================================================
# VALIDATION ANNOTATIONS (for Helm values schema)
# ==============================================================================
# These would be enforced via templates/notices.yaml
#
# Rule 1: Mutually exclusive configuration
#   IF infrastructure.postgres.enabled=true
#   THEN infrastructure.postgres.external.enabled MUST be false
#   FAIL with: "Cannot enable both internal and external PostgreSQL"
#
# Rule 2: Required external configuration
#   IF infrastructure.postgres.external.enabled=true
#   THEN infrastructure.postgres.external.host MUST be non-empty
#   THEN infrastructure.postgres.external.secretRef.name MUST be non-empty
#   FAIL with: "External PostgreSQL requires host and secretRef"
#
# Rule 3: Database dependency check
#   IF infrastructure.postgres.disabled=true AND infrastructure.postgres.external.enabled=false
#   AND any core service requires database
#   FAIL with: "Services require database but none configured"

# ==============================================================================
# USAGE EXAMPLES
# ==============================================================================

# ---
# EXAMPLE 1: INTERNAL INFRASTRUCTURE (default, current behavior)
# ---
# helm install tazama ./tazama-helm-derived
# 
# values.yaml:
#   (use defaults — no changes needed)
#
# Result:
#   - PostgreSQL deployed in-cluster (StatefulSet)
#   - Valkey deployed in-cluster (Deployment)
#   - NATS deployed in-cluster (Deployment)
#   - Services connect via DNS: postgres:5432, valkey:6379, nats:4222

# ---
# EXAMPLE 2: EXTERNAL MANAGED SERVICES (AWS RDS + ElastiCache)
# ---
# helm install tazama ./tazama-helm-derived \
#   --set infrastructure.postgres.enabled=false \
#   --set infrastructure.postgres.external.enabled=true \
#   --set infrastructure.postgres.external.host=mydb.xxxx.rds.amazonaws.com \
#   --set infrastructure.postgres.external.secretRef.name=rds-credentials \
#   --set infrastructure.valkey.enabled=false \
#   --set infrastructure.valkey.external.enabled=true \
#   --set infrastructure.valkey.external.host=mycache.xxxx.cache.amazonaws.com \
#   --set infrastructure.valkey.external.secretRef.name=elasticache-credentials
#
# Pre-requisites:
#   kubectl create secret generic rds-credentials \
#     --from-literal=user=tazama_admin \
#     --from-literal password=<secure-password>
#
# Result:
#   - NO PostgreSQL deployed [C1]
#   - NO Valkey deployed [C1]
#   - NATS deployed internally (still enabled)
#   - Services connect to AWS RDS and ElastiCache

# ---
# EXAMPLE 3: HYBRID (External DB, Internal Cache)
# ---
# helm install tazama ./tazama-helm-derived \
#   --set infrastructure.postgres.enabled=false \
#   --set infrastructure.postgres.external.enabled=true \
#   --set infrastructure.postgres.external.host=mydb.xxxx.rds.amazonaws.com \
#   --set infrastructure.postgres.external.secretRef.name=rds-credentials \
#   --set infrastructure.valkey.enabled=true
#
# Result:
#   - PostgreSQL: External (AWS RDS)
#   - Valkey: Internal (in-cluster)
#   - NATS: Internal (in-cluster)

# ---
# EXAMPLE 4: MINIMAL (Database only, no cache/message broker)
# ---
# helm install tazama ./tazama-helm-derived \
#   --set infrastructure.valkey.disabled=true \
#   --set infrastructure.nats.disabled=true
#
# Result:
#   - PostgreSQL: Internal
#   - Valkey: None (services must handle missing cache)
#   - NATS: None (services must handle missing message broker)
#   - Chart fails if core services require these dependencies [C10]

# ==============================================================================
# SECRET REFERENCE PATTERNS (detailed)
# ==============================================================================
# 
# Pattern A: User-provided existing secret
#   User creates: kubectl create secret generic rds-credentials --from-literal=user=... --from-literal=password=...
#   values: infrastructure.postgres.external.secretRef.name=rds-credentials
#   Template: uses existing secret, no creation
#
# Pattern B: Auto-generated secret (internal mode)
#   values: infrastructure.postgres.passwordSecret.name="" (empty)
#   Template: creates <release>-postgres-credentials with random password
#   User MUST retrieve: kubectl get secret <release>-postgres-credentials -o jsonpath='{.data.password}' | base64 -d
#
# Pattern C: External Secrets Operator integration (future)
#   values: infrastructure.postgres.external.secretRef.name=external-secret-aws-rds
#   External Secrets Operator syncs from AWS Secrets Manager
#   Template: same as Pattern A (decoupled from secret source)
