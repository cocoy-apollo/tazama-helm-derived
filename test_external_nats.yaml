apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: default
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: tazama
    helm.sh/chart: tazama-1.0.0
    app.kubernetes.io/name: tazama
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: valkey
          image: "valkey/valkey:7.2.5"
          command: ["valkey-server"]
          args: ["--port", "6379", "--loglevel", "verbose"]
          ports:
            - containerPort: 6379
              name: valkeyport
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -p 6379 ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -p 6379 ping | grep PONG"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
