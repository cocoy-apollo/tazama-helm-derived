---
# Source: tazama/templates/core/processors.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ed
  template:
    metadata:
      labels:
        app: ed
    spec:
    # START AFFINITY BLOCK
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
    # END AFFINITY BLOCK
      initContainers:
        - name: wait-db
          image: "postgres:18"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d raw_history -c "SELECT 'pain013'::regclass;" >/dev/null 2>&1; do
                echo "Waiting for the full Tazama database schema to finish initializing..."
                sleep 2
              done
        - name: wait-valkey
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z valkey 6379; do sleep 2; done;']
        - name: wait-nats
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nats 4222; do sleep 2; done;']
      containers:
        - name: ed
          image: "docker.io/tazamaorg/event-director:rc"
          env:
            - name: STARTUP_TYPE
              value: "nats" 
            - name: APM_SERVICE_NAME
              value: "event-director"
            - name: FUNCTION_NAME
              value: "event-director" 
            - name: CONSUMER_STREAM
              value: "event-director"
            - name: CONFIGURATION_DATABASE
              value: "configuration"
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
