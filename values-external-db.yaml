# Tazama External Database Values Configuration
# Hybrid deployment: External PostgreSQL + Internal NATS JetStream + Internal Valkey
# Source: github.com/frmscoe rule repositories + internal Helm templates

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

global:
  # Storage class for persistent volumes (empty = default)
  storageClass: "longhorn"
  
  # Image pull policy for all containers
  imagePullPolicy: IfNotPresent
  
  # Default namespace (override with --namespace)
  namespace: tazama
  
  # Security context defaults
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# =============================================================================
# INFRASTRUCTURE CONFIGURATION - EXTERNAL DATABASE MODE
# PostgreSQL: External (user-provided)
# NATS JetStream: Internal (deployed by chart)
# Valkey: Internal (deployed by chart)
# =============================================================================

infrastructure:
  # ============================================================================
  # POSTGRES - External Database
  # User must pre-provision PostgreSQL instance and create necessary databases
  # Databases required: configuration, event_history, raw_history, evaluation
  # ============================================================================
  
  postgres:
    # Disabled: chart will not deploy PostgreSQL
    enabled: false
    disabled: true
    
    # External database configuration
    external:
      enabled: true
      
      # External PostgreSQL host (Kubernetes service DNS name)
      # Format: <service-name>.<namespace>.svc.cluster.local
      host: "tazama-db.tazama.svc.cluster.local"
      
      # PostgreSQL port
      port: 5432
      
      # Database name (used as default, individual services use specific DBs)
      database: "tazama"
      
      # Secret reference for database credentials
      # IMPORTANT: User must create this secret BEFORE installing the chart
      # See PRE-DEPLOYMENT REQUIREMENTS section below
      secretRef:
        # Name of the Kubernetes Secret containing credentials
        name: "tazama-shared-secrets"
        
        # Keys within the secret (these keys are used by Tazama services)
        keys:
          # Username key (services use CONFIGURATION_DATABASE_USER, etc.)
          username: "CONFIGURATION_DATABASE_USER"
          # Password key (services use CONFIGURATION_DATABASE_PASSWORD, etc.)
          password: "CONFIGURATION_DATABASE_PASSWORD"
    
    # Note: When using external database, the following databases must exist:
    # - configuration
    # - event_history  
    # - raw_history
    # - evaluation
    # User is responsible for creating these databases before deploying Tazama

  # ============================================================================
  # VALKEY - Redis-compatible Cache (Internal)
  # Deployment with optional persistence
  # Used for: session storage, caching, temporary data
  # ============================================================================
  
  valkey:
    enabled: true
    disabled: false
    
    image: "valkey/valkey:8.0"
    
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    
    # Persistence for cache data (optional)
    persistence:
      enabled: false
      storageSize: "1Gi"
      storageClass: "longhorn"
    
    # Connection defaults
    port: 6379
    
    # Valkey/Redis configuration
    config:
      maxmemory: "200mb"
      maxmemory-policy: "allkeys-lru"
      timeout: 0
      tcp-keepalive: 300
    
    # External mode disabled (using internal)
    external:
      enabled: false

  # ============================================================================
  # NATS - Message Broker with JetStream (Internal)
  # StatefulSet with persistence for message durability
  # Used for: event streaming, service communication
  # ============================================================================
  
  nats:
    enabled: true
    disabled: false
    
    image: "nats:2.10"
    
    # JetStream configuration for message persistence
    jetStream:
      enabled: true
      storageSize: "5Gi"
      maxMemory: "512Mi"
      maxStore: "2Gi"
    
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    
    # Persistence for JetStream
    persistence:
      enabled: true
      storageClass: "longhorn"
      accessMode: ReadWriteOnce
    
    # NATS server ports
    ports:
      client: 4222
      cluster: 6222
      monitor: 8222
    
    # NATS server configuration
    config:
      maxConnections: 64
      maxPayload: "1MB"
      writeDeadline: "2s"
    
    # External mode disabled (using internal)
    external:
      enabled: false

# =============================================================================
# PRE-DEPLOYMENT REQUIREMENTS
# =============================================================================
# 
# Before installing with this values file, complete the following steps:
#
# 1. Create the namespace:
#    kubectl create namespace tazama
#
# 2. Ensure external PostgreSQL database is running and accessible:
#    - Host: tazama-db.tazama.svc.cluster.local
#    - Port: 5432
#    - Username: postgres
#    - Password: db2f-6dc5-4db4-942
#
# 3. Create required databases in PostgreSQL:
#    psql -h tazama-db.tazama.svc.cluster.local -U postgres -c "
#      CREATE DATABASE configuration;
#      CREATE DATABASE event_history;
#      CREATE DATABASE raw_history;
#      CREATE DATABASE evaluation;
#    "
#
# 4. Create Kubernetes Secret with database credentials:
#    The secret MUST use these exact keys (required by Tazama services):
#
#    kubectl create secret generic tazama-shared-secrets \
#      --from-literal=CONFIGURATION_DATABASE_USER=postgres \
#      --from-literal=CONFIGURATION_DATABASE_PASSWORD='db2f-6dc5-4db4-942' \
#      --from-literal=EVENT_HISTORY_DATABASE_USER=postgres \
#      --from-literal=EVENT_HISTORY_DATABASE_PASSWORD='db2f-6dc5-4db4-942' \
#      --from-literal=EVALUATION_DATABASE_USER=postgres \
#      --from-literal=EVALUATION_DATABASE_PASSWORD='db2f-6dc5-4db4-942' \
#      --from-literal=RAW_HISTORY_DATABASE_USER=postgres \
#      --from-literal=RAW_HISTORY_DATABASE_PASSWORD='db2f-6dc5-4db4-942' \
#      -n tazama
#
# =============================================================================
# INSTALLATION COMMAND
# =============================================================================
#
# helm install tazama ./tazama-1.0.0.tgz \
#   -n tazama \
#   -f values-external-db.yaml
#
# =============================================================================
