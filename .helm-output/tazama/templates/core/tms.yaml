# Source: tazama/templates/core/tms.yaml
apiVersion: v1
kind: Service
metadata:
  name: tms-service
  namespace: default
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: tms
---
# Source: tazama/templates/core/tms.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tms
  template:
    metadata:
      labels:
        app: tms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    # START AFFINITY BLOCK
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    # END AFFINITY BLOCK
      initContainers:
        - name: wait-db
          image: "postgres:18-alpine"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d raw_history -c "SELECT 'pain013'::regclass;" >/dev/null 2>&1; do
                echo "Waiting for the full Tazama database schema to finish initializing..."
                sleep 2
              done
        - name: wait-valkey
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          command: ['sh', '-c', 'until nc -z valkey 6379; do sleep 2; done;']
        - name: wait-nats
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          command: ['sh', '-c', 'until nc -z nats 4222; do sleep 2; done;']
      containers:
        - name: tms
          image: "tazamaorg/tms-service:rc"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          env:
            - name: APM_SERVICE_NAME
              value: "transaction-monitoring-service"
            - name: FUNCTION_NAME
              value: "transaction-monitoring-service" 
            - name: PORT
              value: "3000" 
            - name: STARTUP_TYPE
              value: "nats" 
            - name: PRODUCER_STREAM
              value: "event-director" 
            - name: RAW_HISTORY_DATABASE
              value: "raw_history" 
            - name: EVENT_HISTORY_DATABASE
              value: "event_history" 
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
          ports:
            - containerPort: 3000
