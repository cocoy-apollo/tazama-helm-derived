apiVersion: v1
kind: Service
metadata:
  name: tazama-rules
  namespace: default
  labels:
    app: tazama-rules
    app.kubernetes.io/part-of: tazama
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: rule
---
# Source: tazama/templates/rules/rules.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-001
  namespace: default
  labels:
    app: rule-001
    app.kubernetes.io/name: rule-001
    app.kubernetes.io/part-of: tazama
    app.kubernetes.io/component: rule
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rule-001
  template:
    metadata:
      labels:
        app: rule-001
        app.kubernetes.io/name: rule-001
        app.kubernetes.io/part-of: tazama
        app.kubernetes.io/component: rule
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-db
          image: "postgres:18-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazama-shared-secrets
                  key: CONFIGURATION_DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d raw_history -c "SELECT 'pain013'::regclass;" >/dev/null 2>&1; do
                echo "Waiting for the full Tazama database schema to finish initializing..."
                sleep 2
              done
              echo "Database schema ready"
        - name: wait-valkey
          image: "tazamaorg/busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z valkey 6379; do
                echo "Waiting for Valkey..."
                sleep 2
              done
              echo "Valkey ready"
        - name: wait-nats
          image: "tazamaorg/busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z nats 4222; do
                echo "Waiting for NATS..."
                sleep 2
              done
              echo "NATS ready"
      
      containers:
        - name: rule-001
          image: "tazamaorg/rule-001:rc"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          env:
            - name: STARTUP_TYPE
              value: "nats"
              
            - name: APM_SERVICE_NAME
              value: "rule-001"
            - name: CONFIGURATION_DATABASE
              value: "configuration"
            - name: RAW_HISTORY_DATABASE
              value: "raw_history"
            - name: EVENT_HISTORY_DATABASE
              value: "event_history"
            - name: CONFIGURATION_DATABASE_HOST
              value: "postgres"
            - name: CONFIGURATION_DATABASE_PORT
              value: "5432"
            - name: RAW_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: RAW_HISTORY_DATABASE_PORT
              value: "5432"
            - name: EVENT_HISTORY_DATABASE_HOST
              value: "postgres"
            - name: EVENT_HISTORY_DATABASE_PORT
              value: "5432"
            - name: REDIS_SERVERS
              value: '[{"host":"valkey","port":6379}]'
            - name: REDIS_CLUSTER
              value: "false"
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_CLUSTER_ID
              value: "tazama-cluster"
            - name: FUNCTION_NAME
              value: "rule-001-rel-1-0-0"
            - name: RULE_NAME
              value: "001"
            - name: RULE_VERSION
              value: "1.0.0"
            - name: RISK_WEIGHT
              value: "0.5"
            - name: RULE_DISPLAY_NAME
              value: "Derived account age - creditor"
            - name: RULE_DESCRIPTION
              value: "Analyzes the age of creditor accounts to identify potentially suspicious patterns related to account longevity"
            
          envFrom:
            - secretRef:
                name: tazama-shared-secrets
            - configMapRef:
                name: tazama-core-config
                
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
